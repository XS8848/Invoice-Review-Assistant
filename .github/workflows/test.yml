# ============================================================
#  GitHub Actions · 自动化测试
#  触发时机：推送到 main / 提 PR / 手动触发
#  作用：自动跑单元测试 + 密钥泄露扫描，测试挂了立刻在 PR 上看到红叉
# ============================================================

name: 测试与安全检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # 允许手动点按钮触发

# 同一分支的新推送会取消旧的未完成运行，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r invoice-audit/backend/requirements.txt

      - name: 运行单元测试
        working-directory: invoice-audit
        env:
          # 测试用内存 SQLite，不连生产库
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "ci-test-secret-not-real"
        run: |
          python -m pytest tests/unit/ -v --tb=short

  secret-scan:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 扫描硬编码凭据
        run: |
          echo "检查是否误提交 .env 或明文密码..."
          if [ -f "invoice-audit/.env" ]; then
            echo "错误：.env 被提交了！请检查 .gitignore"
            exit 1
          fi
          # 匹配常见的真实凭据模式
          if grep -rInE "sk-[a-zA-Z0-9]{20,}|password[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}" \
             --include="*.py" --include="*.sh" --include="*.js" \
             invoice-audit/ tools/ 2>/dev/null | grep -v "CHANGE_ME\|REPLACE_ME\|password=\"\"\|your_password"; then
            echo "错误：检测到疑似硬编码凭据"
            exit 1
          fi
          echo "通过：未发现硬编码凭据"

  lint:
    name: 代码风格检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行 ruff 检查
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check invoice-audit/backend/app/ invoice-audit/tests/ --select=E9,F63,F7,F82
          echo "F821 未定义名称等致命错误检查通过"
